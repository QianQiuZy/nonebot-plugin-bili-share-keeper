name: Bug 反馈
description: 当你在代码中发现了一个 Bug，导致应用崩溃或抛出异常，或者有一个组件存在问题，或者某些地方看起来不对劲。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢对项目的支持与关注。在提出问题之前，请确保你已查看相关开发或使用文档：
        - https://github.com/qianqiuzy/nonebot-plugin-bili-share-keeper?tab=readme-ov-file#%EF%B8%8F-%E9%85%8D%E7%BD%AE
  - type: checkboxes
    attributes:
      label: 这个问题是否已经存在？
      options:
        - label: 我已经搜索过现有的问题 (https://github.com/qianqiuzy/nonebot-plugin-bili-share-keeper/issues)
          required: true
  - type: textarea
    attributes:
      label: 如何复现
      description: 请详细告诉我们如何复现你遇到的问题，如涉及代码，可提供一个最小代码示例，并使用反引号```附上它
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
      description: 请告诉我们你预期会发生什么。
    validations:
      required: false
  - type: textarea
    attributes:
      label: 实际结果
      description: 请告诉我们实际发生了什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 截图或视频
      description: 如果可以的话，上传任何关于 bug 的截图，最好能包含 NoneBot 和适配器的日志。
      value: |
        [在这里上传图片]
  - type: input
    id: nonebot_plugin_whats_talk_qwen_version
    attributes:
      label: 插件版本号
      description: 当前你使用的 nonebot-plugin-bili-share-keeper 版本号
    validations:
      required: true
  - type: dropdown
    id: adapterType
    attributes:
      label: 适配器类型
      description: 你当前使用的适配器类型？
      options:
        - napcat
        - lagrange
        - LLOneBot
        - go-cqhttp
        - icqq或者其他
    validations:
      required: true
  - type: input
    id: adapterType_version
    attributes:
      label: 适配器版本
      description: 请填写适配器的版本
    validations:
      required: true
  - type: dropdown
    id: pythonId
    attributes:
      label: Python版本
      description: 你当前使用的Python版本？
      options:
        - Python3.11以上
        - Python3.9~3.11之间
        - Python3.9以下
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: 系统
      description: 你当前使用的系统？
      options:
        - windows
        - linux
        - macos
    validations:
      required: true
